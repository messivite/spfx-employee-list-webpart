name: Release SPFx Solution

on:
  # 1. Automatic trigger: when pushing a tag like "v1.0.0"
  push:
    tags:
      - 'v*'
  # 2. Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Oluşturulan Paketi (sppkg) Otomatik Olarak SharePoint.e Yükle ve Sitelere Dağıt (Deploy)'
        required: true
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for creating a release
  
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Matching package.json engines requirement

      - name: Get Version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build SPFx Solution
        # Runs heft test, clean, package-solution etc.
        run: npm run build

      - name: Verify .sppkg file exists
        run: ls -la sharepoint/solution/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VERSION) }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VERSION) }}
          draft: false
          prerelease: false
          files: |
            sharepoint/solution/*.sppkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to SharePoint App Catalog
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' }}
        env:
          SP_CATALOG_URL: ${{ secrets.SP_CATALOG_URL }}
          SP_APP_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CERT_BASE64: ${{ secrets.SP_CERTIFICATE_BASE64 }}
        run: |
          npm install -g @pnp/cli-microsoft365
          
          # 1. Login to M365 via Certificate Auth
          m365 login --authType certificate --certificateBase64Encoded "$SP_CERT_BASE64" --password "password" --appId "$SP_APP_ID" --tenant "$SP_TENANT_ID"
          
          # 2. Add package to App Catalog
          m365 spo app add --filePath sharepoint/solution/spfx-employees-list.sppkg --appCatalogUrl "$SP_CATALOG_URL" --overwrite
          
          # 3. Deploy app to all sites
          m365 spo app deploy --name "spfx-employees-list.sppkg" --appCatalogUrl "$SP_CATALOG_URL" --skipFeatureDeployment
